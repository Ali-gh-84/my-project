<div class="table-container rtl">
  <div nz-row nzJustify="center" class="image-row">
    <div nz-col xs="22" sm="20" md="16" lg="12" xl="10" class="pic-container">
      <div class="card-body" [innerHTML]="text | safeHtml"></div>
    </div>
  </div>
  <div class="education-grid-wrapper ag-theme-alpine ag-rtl">
    <ag-grid-angular
      style="width:100%; height:500px"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [localeText]="localeText"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [gridOptions]="gridOptions"
    theme="legacy">
    </ag-grid-angular>
  </div>
  <div class="btn-group">
    <button
      nz-button
      nzType="primary"
      [style.background-color]="theme.primary"
      class="btn"
      [routerLink]="['/']">
      <nz-icon nzType="right"/>
      بازگشت به صفحه اصلی
    </button>
  </div>
</div>
